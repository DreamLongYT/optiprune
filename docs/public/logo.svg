<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background / Base Gradient -->
    <linearGradient id="opti-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <!-- Accent Laser Glow Gradient -->
    <linearGradient id="opti-grad-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#8B5CF6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Main Pruned Outer Ring -->
  <g filter="url(#glow)">
    <!-- Top-Right Section of the 'O' -->
    <path d="M 256 64
             C 362 64, 448 150, 448 256
             C 448 290, 439 322, 423 350
             L 340 267
             C 352 240, 345 208, 321 184
             C 297 160, 265 153, 238 165
             L 155 82
             C 185 70, 220 64, 256 64 Z" 
          fill="url(#opti-grad-1)" />

    <!-- Bottom-Left Section of the 'O' (Offset by the Pruning Slash) -->
    <path d="M 256 448
             C 150 448, 64 362, 64 256
             C 64 222, 73 190, 89 162
             L 172 245
             C 160 272, 167 304, 191 328
             C 215 352, 247 359, 274 347
             L 357 430
             C 327 442, 292 448, 256 448 Z" 
          fill="url(#opti-grad-1)" />

    <!-- The Diagonal Laser Slash (Prune Beam) -->
    <polygon points="110,410 410,110 380,80 80,380" fill="url(#opti-grad-2)" opacity="0.9" />
  </g>

  <!-- Core Node Anchor -->
  <circle cx="256" cy="256" r="28" fill="#FFFFFF" opacity="0.95" />
</svg>
